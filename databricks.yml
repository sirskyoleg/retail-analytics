bundle:
  name: retail_analytics

include:
  - resources/*.yml

variables:
  catalog_name:
    description: "Unity Catalog name"
    default: retail_ai3
  
  warehouse_id:
    description: "SQL Warehouse ID for queries"

targets:
  # Development environment
  dev:
    mode: development
    default: true
    workspace:
      host: https://your-dev-workspace.cloud.databricks.com
      root_path: /Workspace/.bundles/dev/${bundle.name}
    
    variables:
      catalog_name: retail_ai3_dev
      warehouse_id: ${var.dev_warehouse_id}
    
    resources:
      pipelines:
        retail_pipeline:
          development: true
          continuous: false
  
  # Production environment
  prod:
    mode: production
    workspace:
      host: https://your-prod-workspace.cloud.databricks.com
      root_path: /Workspace/.bundles/prod/${bundle.name}
    
    variables:
      catalog_name: retail_ai3
      warehouse_id: ${var.prod_warehouse_id}
    
    resources:
      pipelines:
        retail_pipeline:
          development: false
          continuous: true
          
    run_as:
      service_principal_name: "sp-retail-analytics-prod"