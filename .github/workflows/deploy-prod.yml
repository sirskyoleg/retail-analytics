name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      run_pipeline:
        description: 'Run pipeline after deployment'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  deploy-prod:
    runs-on: ubuntu-latest
    environment: production
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Databricks CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh
      
      - name: Validate Bundle
        env:
          DATABRICKS_HOST: ${{ secrets.PROD_DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.PROD_DATABRICKS_TOKEN }}
        run: |
          echo "Validating bundle for production..."
          databricks bundle validate --target prod
      
      - name: Deploy to Production
        env:
          DATABRICKS_HOST: ${{ secrets.PROD_DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.PROD_DATABRICKS_TOKEN }}
        run: |
          echo "Deploying to production workspace..."
          databricks bundle deploy --target prod
      
      - name: Run Pipeline (Optional)
        if: github.event.inputs.run_pipeline == 'true'
        env:
          DATABRICKS_HOST: ${{ secrets.PROD_DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.PROD_DATABRICKS_TOKEN }}
        run: |
          echo "Starting pipeline run..."
          databricks bundle run retail_pipeline --target prod
      
      - name: Deployment Summary
        run: |
          echo "✅ Successfully deployed to production!"
          echo "Workspace: ${{ secrets.PROD_DATABRICKS_HOST }}"
          echo "Bundle: retail_analytics"
          echo "Target: prod"
